name: Current MR NEON PR source snapshot

on:
  push:
    branches:
      - handoff/source-snapshot-2026-11-28

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact snapshot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Create archive from tracked source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/mr-neon-source.zip" HEAD
          unzip -t "$RUNNER_TEMP/mr-neon-source.zip"
      - name: Upload source archive
        uses: actions/upload-artifact@7.0.2
        with:
          name: mr-neon-final-pr-source
          path: ${{ runner.temp }}/mr-neon-source.zip
          if-no-files-found: error
          retention-days: 1
