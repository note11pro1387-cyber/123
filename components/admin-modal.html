<!-- MR NEON: Admin authentication only. The operational workspace lives on admin.php. -->
<div
  class="admin-login-modal"
  id="adminLoginModal"
  hidden
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-labelledby="adminLoginTitle"
>
  <div class="admin-modal-overlay" id="adminModalOverlay"></div>
  <div class="admin-modal-container">
    <div class="admin-modal-header">
      <h3 id="adminLoginTitle">ورود به پنل مدیریت</h3>
      <button
        type="button"
        class="admin-modal-close"
        id="adminModalClose"
        aria-label="بستن"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="admin-modal-body" id="adminModalBody">
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminUsername" class="form-label">نام کاربری</label
          ><input
            type="text"
            id="adminUsername"
            name="username"
            class="form-input"
            required
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label for="adminPassword" class="form-label">رمز عبور</label
          ><input
            type="password"
            id="adminPassword"
            name="password"
            class="form-input"
            required
            autocomplete="current-password"
          />
        </div>
        <div class="form-group">
          <label for="adminTotpCode" class="form-label">کد تأیید دومرحله‌ای</label>
          <input
            type="text"
            id="adminTotpCode"
            name="totpCode"
            class="form-input"
            inputmode="numeric"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            autocomplete="one-time-code"
            aria-describedby="adminTotpHelp"
            required
          />
          <small id="adminTotpHelp">کد شش‌رقمی برنامهٔ احراز هویت</small>
        </div>
        <div class="form-group admin-login-submit-group">
          <button type="submit" class="btn btn-primary btn-block">ورود</button>
        </div>
      </form>
    </div>
  </div>
</div>
